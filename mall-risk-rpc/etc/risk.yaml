Name: risk.rpc
ListenOn: 0.0.0.0:9014
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: yw-mall/risk-rpc

DataSource: proxysql:proxysql123@tcp(127.0.0.1:6033)/mall_risk?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379

RedisCache:
  Host: 127.0.0.1:6379
  Type: node

Kafka:
  # env baseline 只起 kafka1 (slim 模式)。启 kafka-ha profile 时把 19093/19094 追加。
  Brokers:
    - 127.0.0.1:19092

TokenSecret: "mall-risk-hmac-secret-change-in-production"
