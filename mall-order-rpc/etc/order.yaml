Name: order.rpc
ListenOn: 0.0.0.0:9003
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: yw-mall/order-rpc

DataSource: proxysql:proxysql123@tcp(127.0.0.1:6033)/mall_order?charset=utf8mb4&parseTime=true&loc=Local

Cache:
  - Host: 127.0.0.1:6379

Kafka:
  # env baseline 只起 kafka1 (slim 模式)。启 kafka-ha profile 时把 19093/19094 追加。
  Brokers:
    - 127.0.0.1:19092
  OrderShippedTopic: order.shipped

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: yw-mall/user-rpc

ProductRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: yw-mall/product-rpc

PaymentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: yw-mall/payment-rpc
