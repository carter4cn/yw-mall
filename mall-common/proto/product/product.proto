syntax = "proto3";

package product;

option go_package = "./product";

message CreateProductReq {
  string name = 1;
  string description = 2;
  int64 price = 3;
  int64 stock = 4;
  int64 category_id = 5;
  string images = 6;
  int64 shop_id = 7;
  // M2: 多 SKU 数组，空时后端建 1 个 default SKU 兼容旧路径
  repeated SkuInput skus = 8;
  // SPU 扩展字段（之前只在 detail 里有，create 时补上）
  string brand = 9;
  string detail = 10;
}

message CreateProductResp {
  int64 id = 1;
}

message GetProductReq {
  int64 id = 1;
}

message GetProductResp {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 price = 4;
  int64 stock = 5;
  int64 category_id = 6;
  string images = 7;
  int32 status = 8;
  int64 create_time = 9;
  int64 shop_id = 11;
}

message ListProductsReq {
  int64 category_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListProductsResp {
  repeated GetProductResp products = 1;
  int64 total = 2;
}

message UpdateStockReq {
  int64 id = 1;
  int64 delta = 2;
}

message UpdateStockResp {}

message SearchProductsReq {
  string keyword = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message SearchProductsResp {
  repeated GetProductResp products = 1;
  int64 total = 2;
}

// ===== SKU lock (DTM SAGA branches) =====
message LockSkuReq {
  int64 product_id = 1;
  int64 user_id = 2;
  int32 quantity = 3;
  string idempotency_key = 4;
}

message LockSkuResp {
  bool ok = 1;
  int64 stock_left = 2;
}

message UnlockSkuReq {
  int64 product_id = 1;
  int64 user_id = 2;
  int32 quantity = 3;
  string idempotency_key = 4;
}

message UnlockSkuResp {}

message ListShopProductsReq {
  int64 shop_id   = 1;
  int32 page      = 2;
  int32 page_size = 3;
}

// ===== Merchant & Admin Product Management =====
message OkResp { bool ok = 1; }

message UpdateProductReq {
  int64  id = 1;
  int64  shop_id = 2;
  string name = 3;
  string description = 4;
  int64  price = 5;
  int64  category_id = 6;
  string images = 7;
  string detail = 8;
  string brand = 9;
  double weight = 10;
}

message SetProductStatusReq { int64 id = 1; int64 shop_id = 2; int32 status = 3; }

message SetProductStockReq { int64 id = 1; int64 stock = 2; }

message MerchantListProductsReq {
  int64 shop_id = 1;
  int32 status = 2;        // -1 = all
  int32 review_status = 3; // -1 = all
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListReviewProductsReq {
  int32 review_status = 1; // 0=pending,1=approved,2=rejected
  int32 page = 2;
  int32 page_size = 3;
}

message AdminReviewProductReq {
  int64  id = 1;
  int32  action = 2; // 1=approve, 2=reject
  string remark = 3;
  int64  reviewer_id = 4;
}

message ProductDetailResp {
  int64  id = 1;
  string name = 2;
  string description = 3;
  int64  price = 4;
  int64  stock = 5;
  int64  category_id = 6;
  string images = 7;
  int32  status = 8;
  int64  create_time = 9;
  int64  shop_id = 10;
  int32  review_status = 11;
  string review_remark = 12;
  string detail = 13;
  string brand = 14;
  double weight = 15;
  // M2: 多 SKU 列表（status=1 的活跃 SKU）
  repeated SkuItem skus = 16;
}

// ===== M2 multi-SKU =====
message SkuInput {
  // id=0 表示新建; >0 表示 update 已有 SKU; status=0 表示软删
  int64  id        = 1;
  string sku_code  = 2;  // 空则后端按 P{pid}-S{idx} 自动生成
  string spec_text = 3;
  string spec_json = 4;
  int64  price     = 5;
  int64  stock     = 6;
  string image     = 7;
  int32  status    = 8;  // 0=use default(1=active); 直接传 1/2 也行
}

message SkuItem {
  int64  id          = 1;
  int64  product_id  = 2;
  string sku_code    = 3;
  string spec_text   = 4;
  string spec_json   = 5;
  int64  price       = 6;
  int64  stock       = 7;
  string image       = 8;
  int32  status      = 9;
}

message BatchUpsertSkusReq {
  int64 product_id = 1;
  int64 shop_id    = 2; // 校验所有权
  repeated SkuInput skus = 3;
}
message BatchUpsertSkusResp {
  repeated SkuItem items = 1;
}

service Product {
  rpc CreateProduct(CreateProductReq) returns (CreateProductResp);
  rpc GetProduct(GetProductReq) returns (GetProductResp);
  rpc ListProducts(ListProductsReq) returns (ListProductsResp);
  rpc ListShopProducts(ListShopProductsReq) returns (ListProductsResp);
  rpc UpdateStock(UpdateStockReq) returns (UpdateStockResp);
  rpc SearchProducts(SearchProductsReq) returns (SearchProductsResp);
  rpc LockSku(LockSkuReq) returns (LockSkuResp);
  rpc UnlockSku(UnlockSkuReq) returns (UnlockSkuResp);
  rpc UpdateProduct(UpdateProductReq) returns (OkResp);
  rpc SetProductStatus(SetProductStatusReq) returns (OkResp);
  rpc SetProductStock(SetProductStockReq) returns (OkResp);
  rpc MerchantListProducts(MerchantListProductsReq) returns (ListProductsResp);
  rpc AdminListReviewProducts(AdminListReviewProductsReq) returns (ListProductsResp);
  rpc AdminReviewProduct(AdminReviewProductReq) returns (OkResp);
  rpc GetProductDetail(GetProductReq) returns (ProductDetailResp);

  // M2: SKU 矩阵批量 upsert
  rpc BatchUpsertSkus(BatchUpsertSkusReq) returns (BatchUpsertSkusResp);
}
